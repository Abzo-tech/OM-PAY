version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=om_pay_db
      - DB_USERNAME=om_pay_user
      - DB_PASSWORD=om_pay_password
    depends_on:
      - db
    volumes:
      - .:/var/www/html
    networks:
      - om-pay-network

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=om_pay_db
      - POSTGRES_USER=om_pay_user
      - POSTGRES_PASSWORD=om_pay_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - om-pay-network

volumes:
  postgres_data:

networks:
  om-pay-network:
    driver: bridge