  #     - om-pay-network

  # nginx:
  #   image: nginx:alpine
  #   container_name: om-pay-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - app
  #   networks:
  #     - om-pay-network

  redis:
    image: redis:7-alpine
    container_name: om-pay-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - om-pay-network

volumes:
  postgres_data:
  redis_data:

networks:
  om-pay-network:
    driver: bridge