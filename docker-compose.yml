version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: om-pay-api
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_NAME=OM-PAY-API
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=false
      - APP_URL=http://localhost

      - DB_CONNECTION=pgsql
      - DB_HOST=ep-summer-credit-a4dyaduu-pooler.us-east-1.aws.neon.tech
      - DB_PORT=5432
      - DB_DATABASE=neondb
      - DB_USERNAME=neondb_owner
      - DB_PASSWORD=npg_cSa9zMRQW8DO
      - DB_SSLMODE=require
      - DB_CHANNEL_BINDING=require

      - CACHE_DRIVER=file
      - QUEUE_CONNECTION=sync
      - SESSION_DRIVER=file

      - LOG_CHANNEL=stack
      - LOG_LEVEL=error
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      - redis
    networks:
      - om-pay-network

  # db:
